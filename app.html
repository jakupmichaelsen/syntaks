<!DOCTYPE html>
<html>
<head>
    <script src="https://use.fontawesome.com/4d36999296.js"></script>
    <script src='/app/external_libs/jquery-3.2.0.min.js'></script>
    <script src='http://ariutta.github.io/svg-pan-zoom/dist/svg-pan-zoom.min.js'></script>
    <script src='/app/external_libs/rgbcolor.js'></script>
    <script src='/app/external_libs/StackBlur.js'></script>
    <script src='/app/external_libs/canvg.js'></script>
    <script src='/app/external_libs/snap.js'></script>
    <script src='/app/modal.js'></script>
    <script src='/app/singletons/lib.js'></script>
    <script src='/app/singletons/tutorial.js'></script>
    <script src='/app/singletons/toolbar.js'></script>
    <script src='/app/singletons/history.js'></script>
    <script src='/app/singletons/workspace.js'></script>
    <script src='/app/classes/action.js'></script>
    <script src='/app/classes/page.js'></script>
    <script src='/app/classes/tree.js'></script>
    <script src='/app/classes/elements/node.js'></script>
    <script src='/app/classes/elements/branch.js'></script>
    <script src='/app/classes/elements/arrow.js'></script>
    <script src='/app/classes/elements/element.js'></script>
    <script src='/app/classes/elements/selectableElement.js'></script>
    <script src='/app/classes/elements/graphic.js'></script>
    <link rel="stylesheet" href="/style/css/main.css">
</head>
<body class="page_make">
    <div id='workspace_container'>
        <div class='loading_screen'>
            <img src='/resources/hourglass.gif'>
        </div>
        <div class='modal_body modal_export' modal-id='export' with-overlay='app'>
            <p class='modal_title modal_title__main'>Export</p>
            <div class='modal_section modal_section__filetype'>
                <span class='option_wrapper'>
                    <span class='option_wrapper_radio'>
                        <div class='modal_option modal_option__png option_radio'>
                            <label class='modal_label'>
                                <input type='radio' name='filetype' value='png' checked='checked'>
                                <span></span>Image <span class='note'>PNG</span>
                            </label>
                        </div>
                        <div class='modal_option modal_option__bracket-file option_radio'>
                            <label class='modal_label'>
                                <input type='radio' name='filetype' value='bracket-file'>
                                <span></span>Bracket notation
                            </label>
                        </div>
                        <div class='modal_option modal_option__tree-file option_radio'>
                            <label class='modal_label'>
                                <input type='radio' name='filetype' value='tree-file'>
                                <span></span>Tree File <br><span class='note'>Upload later to continue your work</span>
                            </label>
                        </div>
                    </span>
                    <div class='modal_option modal_option__fname'>
                        <input type='text' value='mytree'><span>.png</span>
                    </div>
                </span>
            </div>
            <div class='modal_section modal_section__buttonset'>
                <button class='button button_modal button_modal__export'>Export</button>
                <button class='button button_modal button_modal__cancel'>Cancel</button>
            </div>
        </div>
        <div class='modal_body modal_open' modal-id='open' with-overlay='app'>
            <p class='modal_title modal_title__main'>Open</p>
            <div class='modal_section modal_section__trees'>
            </div>
        </div>
        <div class='modal_body modal_tutorial' modal-id='tutorial' with-overlay='app'>
            <p class='modal_title modal_title__main'>Tutorial?</p>
            <div class='modal_section modal_section__buttonset'>
                <button class='button button_modal button_modal__begin-tutorial'>Yes</button>
                <button class='button button_modal button_modal__cancel'>Cancel</button>
            </div>
        </div>
        <div class='overlay' overlay-id='app'>
        </div>
        <ul id='toolbar'>
            <li class='toolbar_button toolbar_button__new-tree'>New Tree</li>
            <li class='toolbar_button toolbar_button__new-project' onclick='window.location.reload(); return false;'>New Project</li>
            <li class='toolbar_button toolbar_button__tree-switcher'>
                <select class='tree-switcher'></select>
            </li>
            <li class='toolbar_button toolbar_button__export modal_trigger' for-modal='export'>Save</li>
            <li class='toolbar_button toolbar_button__upload'>Load</li>
            <span class='toolbar_area toolbar_area_right'>
                <a target='_blank' href='https://github.com/jakupmichaelsen/syntaks'><li class='toolbar_button toolbar_button__help'>Help</li></a>
                <li class='toolbar_button toolbar_button__tutorial'>Tutorial</li>
            </span>
        </ul>
        <svg id='workspace' width='100%' height='100%' tabIndex='0'>
            <marker id='Triangle' viewBox='0 0 10 10' refX='1' refY='5'
                markerWidth='6' markerHeight='6' orient='auto'>
              <path d='M 0 0 L 10 5 L 0 10 z' />
            </marker>
        </svg>
        <div class='editor_container'></div>
        <canvas id='export-image-canvas'></canvas>
    </div>

    <script>
        $(document).ready(function() {
            init = {
                upload_enabled: true,
                tutorial_enabled: false,
                client_export_enabled: true,
            };
            new Syntree.initialize(init);
            $('#workspace_container .loading_screen').remove();
        });
    </script>
</body>
</html>
