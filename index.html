<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>syntaks v10 sentence root + top editor</title>
<style>
:root{
  --bg:#282828;--bg2:#32302f;--fg:#ebdbb2;--muted:#a89984;--line:#bdae93;
  --border:#928374;--accent:#fabd2f;--green:#b8bb26;--red:#fb4934;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
button,input{font:inherit}
.app{display:grid;grid-template-columns:280px 1fr;height:100vh}
.sidebar{border-right:1px solid #504945;background:#1d2021;padding:14px;display:flex;flex-direction:column;gap:12px}
.brand{font-size:14px;color:var(--accent);letter-spacing:.04em}
.project-title{width:100%;background:transparent;color:var(--fg);border:1px solid #504945;border-radius:6px;padding:8px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px}
button{background:transparent;border:1px solid var(--border);color:var(--fg);border-radius:6px;padding:6px 8px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
.tree-list{display:flex;flex-direction:column;gap:6px;overflow:auto}
.tree-item{border:1px solid #504945;border-radius:8px;padding:8px;cursor:pointer;color:var(--muted)}
.tree-item.active{border-color:var(--accent);color:var(--fg);background:#282828}
.hint{font-size:12px;color:var(--muted);line-height:1.45;margin-top:auto}
.main{position:relative;display:grid;grid-template-rows:auto 1fr;background:
  radial-gradient(circle at 20px 20px,#3c3836 1px,transparent 1px) 0 0/32px 32px,var(--bg)}
.topbar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid #3c3836;background:rgba(29,32,33,.92)}
.editor-wrap{position:absolute;top:62px;left:50%;transform:translateX(-50%);width:min(760px,calc(100% - 80px));z-index:5;display:flex;gap:8px;align-items:center;pointer-events:none}
.editor-label{color:var(--muted);font-size:13px;white-space:nowrap}
.top-editor{display:block;width:100%;min-width:240px;padding:8px 14px;border:1px solid #665c54;border-radius:7px;
  background:rgba(60,56,54,.96);color:var(--fg);font-size:20px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:auto}
.top-editor.editing{border-color:var(--accent);box-shadow:0 0 0 2px rgba(250,189,47,.18)}
.top-editor:focus{outline:2px solid var(--accent);outline-offset:2px}
.canvas{position:relative;overflow:hidden;touch-action:none;cursor:grab}
.canvas.dragging{cursor:grabbing}
.world{position:absolute;left:50%;top:190px;transform-origin:0 0}
svg.lines{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.node{position:absolute;min-width:72px;padding:7px 12px;text-align:center;border:1px solid var(--border);border-radius:7px;
  background:rgba(40,40,40,.96);color:var(--fg);box-shadow:0 1px 0 rgba(0,0,0,.5);user-select:none;cursor:pointer;white-space:nowrap}
.node.root{min-width:260px;max-width:560px;white-space:normal;overflow-wrap:anywhere;font-size:20px;line-height:1.32;background:rgba(60,56,54,.96);border-color:#665c54}
.node.word{border-color:transparent;background:transparent;color:var(--fg);box-shadow:none}
.node.function{font-size:21px}
.node.selected{outline:2px solid var(--accent);outline-offset:2px}
.status{position:absolute;right:10px;bottom:8px;color:var(--muted);font-size:12px}
.file-input{display:none}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">syntaks v10 · sentence root + top editor</div>
    <input id="projectTitle" class="project-title" value="Basic notation examples" aria-label="Project title">
    <div class="toolbar">
      <button id="newTree">+ tree</button>
      <button id="deleteTree">delete</button>
      <button id="openBtn">open JSON</button>
      <button id="saveBtn">save JSON</button>
      <input id="fileInput" class="file-input" type="file" accept="application/json,.json">
    </div>
    <div id="treeList" class="tree-list"></div>
    <div class="hint">
      <b>Editing model:</b><br>
      The sentence is again the first visible/root node.<br><br>
      Select any node, then press <b>Enter</b> or <b>F2</b> to edit it in the top box.
      Press Enter to apply. Esc cancels.
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <button id="addChild">add child</button>
      <button id="addSibling">add sibling</button>
      <button id="deleteNode">delete node</button>
      <button id="fit">fit</button>
      <button id="reset">reset</button>
      <button id="zoomIn">+</button>
      <button id="zoomOut">−</button>
    </div>

    <div class="editor-wrap">
      <div class="editor-label">edit</div>
      <input id="topEditor" class="top-editor" spellcheck="false" value="" placeholder="Select a node, then press Enter or F2">
    </div>

    <div id="canvas" class="canvas">
      <div id="world" class="world">
        <svg id="lines" class="lines"></svg>
        <div id="nodes"></div>
      </div>
    </div>
    <div id="status" class="status">v10-sentence-root-top-editor · ready</div>
  </main>
</div>

<script>
const LS_KEY = "syntaks-v10-sentence-root-top-editor";
const uid = () => Math.random().toString(36).slice(2,9);

let project = {
  version: 1,
  title: "Basic notation examples",
  trees: [
    makeTree("De fleste elever er meget flittige.", [
      ["S","de fleste elever"], ["V","er"], ["A","meget"], ["SP","flittige"]
    ]),
    makeTree("Drengen køber slik.", [
      ["S","drengen"], ["V","køber"], ["DO","slik"]
    ]),
    makeTree("Endelig ankommer toget.", [
      ["A","endelig"], ["V","ankommer"], ["S","toget"]
    ]),
    makeTree("Borgmesteren giver Dronningen hånden.", [
      ["S","borgmesteren"], ["V","giver"], ["IO","dronningen"], ["DO","hånden"]
    ])
  ]
};

let activeTreeId = project.trees[0].id;
let selectedNodeId = null;
let view = {x:0,y:0,scale:1};
let draggingNode = null;
let draggingCanvas = null;

function makeTree(sentence, pairs){
  const root = "root-" + uid();
  const nodes = [{id:root,label:sentence,x:0,y:-55,parentId:null,kind:"root"}];
  const spacing = Math.max(130, 520 / Math.max(1, pairs.length-1));
  const start = -spacing * (pairs.length-1) / 2;
  pairs.forEach((p,i)=>{
    const f = "fn-" + uid(), w = "wd-" + uid();
    const x = start + i * spacing;
    nodes.push({id:f,label:p[0],x:x,y:85,parentId:root,kind:"function"});
    nodes.push({id:w,label:p[1],x:x,y:205,parentId:f,kind:"word"});
  });
  return {id:"tree-"+uid(), title: sentence, nodes};
}

function activeTree(){ return project.trees.find(t=>t.id===activeTreeId) || project.trees[0]; }
function getNode(id){ return activeTree().nodes.find(n=>n.id===id); }

function rootNode(tree=activeTree()){ return tree.nodes.find(n=>n.parentId===null) || tree.nodes[0]; }

function autosave(){
  syncTreeTitleFromRoot();
  localStorage.setItem(LS_KEY, JSON.stringify(project));
  status("autosaved");
}

function status(text){ document.getElementById("status").textContent = "v10-sentence-root-top-editor · " + text; }

function restore(){
  const saved = localStorage.getItem(LS_KEY);
  if(saved){
    try{
      project = JSON.parse(saved);
      project.trees.forEach(t=>{
        const r = rootNode(t);
        if(r) t.title = r.label;
      });
      activeTreeId = project.trees[0]?.id;
    }catch(e){}
  }
}

function syncTreeTitleFromRoot(){
  const tree = activeTree();
  const r = rootNode(tree);
  if(tree && r) tree.title = r.label;
}

function renderAll(){
  document.getElementById("projectTitle").value = project.title || "";
  renderTreeList();
  renderCanvas();
}

function renderTreeList(){
  const list = document.getElementById("treeList");
  list.innerHTML = "";
  project.trees.forEach((tree, idx)=>{
    const r = rootNode(tree);
    tree.title = r?.label || tree.title || "Untitled sentence";
    const item = document.createElement("div");
    item.className = "tree-item" + (tree.id===activeTreeId ? " active" : "");
    item.textContent = (idx+1) + ". " + tree.title;
    item.onclick = ()=>{
      activeTreeId = tree.id;
      selectedNodeId = rootNode(tree)?.id || null;
      renderAll();
      autosave();
    };
    list.appendChild(item);
  });
}

function renderCanvas(){
  drawNodes();
  drawLines();
  applyView();
  updateTopEditor();
}

function nodeBox(n){
  const label = n.label || "";
  if(n.kind==="root"){
    const w = Math.min(560, Math.max(260, label.length * 12 + 36));
    const lines = Math.max(1, Math.ceil((label.length * 12 + 36) / 560));
    const h = 28 + lines * 28;
    return {w,h};
  }
  let w = Math.max(n.kind==="function" ? 72 : 42, label.length * (n.kind==="function" ? 15 : 9) + 24);
  if(n.kind==="word") w = Math.max(40, label.length * 9 + 8);
  const h = n.kind==="function" ? 44 : 30;
  return {w,h};
}

function drawNodes(){
  const host = document.getElementById("nodes");
  host.innerHTML = "";
  activeTree().nodes.forEach(n=>{
    const b = nodeBox(n);
    const el = document.createElement("div");
    el.className = "node " + (n.kind || "function") + (n.id===selectedNodeId ? " selected" : "");
    el.textContent = n.label;
    el.style.left = (n.x - b.w/2) + "px";
    el.style.top = n.y + "px";
    el.style.width = b.w + "px";
    el.dataset.id = n.id;

    el.onclick = (e)=>{ e.stopPropagation(); selectedNodeId = n.id; renderCanvas(); };
    el.ondblclick = (e)=>{ e.stopPropagation(); selectedNodeId = n.id; renderCanvas(); startTopEdit(); };
    el.onpointerdown = (e)=>{
      if(document.activeElement === document.getElementById("topEditor")) return;
      e.stopPropagation();
      selectedNodeId = n.id;
      draggingNode = {id:n.id, startX:e.clientX, startY:e.clientY, ox:n.x, oy:n.y};
      el.setPointerCapture(e.pointerId);
      renderCanvas();
    };
    host.appendChild(el);
  });
}

function drawLines(){
  const svg = document.getElementById("lines");
  svg.innerHTML = "";
  const tree = activeTree();
  tree.nodes.filter(n=>n.parentId).forEach(n=>{
    const p = getNode(n.parentId);
    if(!p) return;
    const pb = nodeBox(p), nb = nodeBox(n);
    const x1 = p.x, y1 = p.y + pb.h;
    const x2 = n.x, y2 = n.y;
    svg.appendChild(svgLine(x1,y1,x2,y2));
  });
}

function svgLine(x1,y1,x2,y2){
  const line = document.createElementNS("http://www.w3.org/2000/svg","line");
  line.setAttribute("x1",x1); line.setAttribute("y1",y1);
  line.setAttribute("x2",x2); line.setAttribute("y2",y2);
  line.setAttribute("stroke","var(--line)");
  line.setAttribute("stroke-width","1.5");
  line.setAttribute("vector-effect","non-scaling-stroke");
  return line;
}

function applyView(){
  document.getElementById("world").style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
}

function updateTopEditor(){
  const input = document.getElementById("topEditor");
  const node = selectedNodeId ? getNode(selectedNodeId) : null;
  if(node){
    input.value = node.label || "";
    input.placeholder = node.kind === "root" ? "Editing sentence/root node" : "Editing selected node";
  }else{
    input.value = "";
    input.placeholder = "Select a node, then press Enter or F2";
  }
}

function startTopEdit(){
  const input = document.getElementById("topEditor");
  const node = selectedNodeId ? getNode(selectedNodeId) : null;
  if(!node){
    status("select a node first");
    return;
  }
  input.value = node.label || "";
  input.classList.add("editing");
  input.focus();
  input.select();
}

function commitTopEdit(){
  const input = document.getElementById("topEditor");
  const value = input.value.trim();
  const node = selectedNodeId ? getNode(selectedNodeId) : null;
  if(node){
    node.label = value || node.label;
    if(node.kind === "root") activeTree().title = node.label;
    input.classList.remove("editing");
    renderAll();
    autosave();
    status("node updated");
  }
}

function cancelTopEdit(){
  document.getElementById("topEditor").classList.remove("editing");
  updateTopEditor();
}

function addChild(){
  const tree = activeTree();
  if(!selectedNodeId) return status("select a node first");
  const parent = getNode(selectedNodeId);
  const childKind = parent.kind === "function" ? "word" : "function";
  const child = {
    id:"node-"+uid(),
    label: childKind === "word" ? "ord" : "?",
    x:parent.x,
    y:parent.y + (parent.kind === "root" ? 140 : 110),
    parentId:parent.id,
    kind:childKind
  };
  tree.nodes.push(child);
  selectedNodeId = child.id;
  renderAll(); autosave();
}

function addSibling(){
  const tree = activeTree();
  if(!selectedNodeId) return status("select a node first");
  const node = getNode(selectedNodeId);
  if(!node.parentId) return status("root node cannot have a sibling");
  const sib = {id:"node-"+uid(),label:"?",x:node.x+120,y:node.y,parentId:node.parentId,kind:node.kind};
  tree.nodes.push(sib);
  selectedNodeId = sib.id;
  renderAll(); autosave();
}

function deleteNode(){
  if(!selectedNodeId) return;
  const tree = activeTree();
  const node = getNode(selectedNodeId);
  if(node && node.kind === "root") return status("root sentence node cannot be deleted");
  const remove = new Set([selectedNodeId]);
  let changed = true;
  while(changed){
    changed = false;
    tree.nodes.forEach(n=>{
      if(remove.has(n.parentId) && !remove.has(n.id)){ remove.add(n.id); changed = true; }
    });
  }
  tree.nodes = tree.nodes.filter(n=>!remove.has(n.id));
  selectedNodeId = rootNode(tree)?.id || null;
  renderAll(); autosave();
}

function fit(){
  const visible = activeTree().nodes;
  if(!visible.length) return;
  const xs = visible.map(n=>n.x), ys = visible.map(n=>n.y);
  const minX=Math.min(...xs)-180, maxX=Math.max(...xs)+180, minY=Math.min(...ys)-140, maxY=Math.max(...ys)+160;
  const canvas = document.getElementById("canvas").getBoundingClientRect();
  const scale = Math.min(1.2, Math.max(.35, Math.min(canvas.width/(maxX-minX), canvas.height/(maxY-minY))));
  view.scale = scale;
  view.x = -(minX+maxX)/2*scale;
  view.y = 20 - minY*scale;
  applyView();
}

function reset(){ view={x:0,y:0,scale:1}; applyView(); }
function zoom(factor, cx, cy){
  const before = {x:(cx-view.x)/view.scale, y:(cy-view.y)/view.scale};
  view.scale = Math.max(.2, Math.min(3, view.scale*factor));
  view.x = cx - before.x*view.scale;
  view.y = cy - before.y*view.scale;
  applyView();
}

document.getElementById("projectTitle").oninput = e=>{ project.title=e.target.value; autosave(); };
document.getElementById("topEditor").onkeydown = e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    commitTopEdit();
    e.currentTarget.blur();
  }
  if(e.key==="Escape"){
    e.preventDefault();
    cancelTopEdit();
    e.currentTarget.blur();
  }
};
document.getElementById("topEditor").onfocus = e=>{
  if(selectedNodeId) e.currentTarget.classList.add("editing");
};
document.getElementById("topEditor").onblur = e=>{
  if(e.currentTarget.classList.contains("editing")) commitTopEdit();
};

document.getElementById("newTree").onclick=()=>{
  const t = makeTree("Ny sætning.", [["S","?"],["V","?"]]);
  project.trees.push(t); activeTreeId=t.id; selectedNodeId=rootNode(t).id; renderAll(); autosave();
};
document.getElementById("deleteTree").onclick=()=>{
  if(project.trees.length<=1) return status("keep at least one tree");
  if(!confirm("Delete current tree?")) return;
  project.trees = project.trees.filter(t=>t.id!==activeTreeId);
  activeTreeId = project.trees[0].id; selectedNodeId=rootNode(project.trees[0]).id; renderAll(); autosave();
};
document.getElementById("addChild").onclick=addChild;
document.getElementById("addSibling").onclick=addSibling;
document.getElementById("deleteNode").onclick=deleteNode;
document.getElementById("fit").onclick=fit;
document.getElementById("reset").onclick=reset;
document.getElementById("zoomIn").onclick=()=>zoom(1.15, window.innerWidth/2, window.innerHeight/2);
document.getElementById("zoomOut").onclick=()=>zoom(1/1.15, window.innerWidth/2, window.innerHeight/2);

document.getElementById("saveBtn").onclick=()=>{
  syncTreeTitleFromRoot();
  const blob = new Blob([JSON.stringify(project,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (project.title || "syntaks-project").toLowerCase().replace(/[^a-z0-9æøå]+/gi,"-") + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
};
document.getElementById("openBtn").onclick=()=>document.getElementById("fileInput").click();
document.getElementById("fileInput").onchange=async e=>{
  const file = e.target.files[0]; if(!file) return;
  const text = await file.text();
  project = JSON.parse(text);
  project.trees.forEach(t=>{
    const r = rootNode(t);
    if(r) t.title = r.label;
  });
  activeTreeId = project.trees[0]?.id;
  selectedNodeId = rootNode(activeTree())?.id || null;
  renderAll(); autosave(); status("loaded JSON");
};

const canvas = document.getElementById("canvas");
canvas.onpointerdown = e=>{
  if(e.target !== canvas) return;
  draggingCanvas = {x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};
  canvas.classList.add("dragging");
};
window.onpointermove = e=>{
  if(draggingNode){
    const n = getNode(draggingNode.id); if(!n) return;
    n.x = draggingNode.ox + (e.clientX-draggingNode.startX)/view.scale;
    n.y = draggingNode.oy + (e.clientY-draggingNode.startY)/view.scale;
    drawNodes(); drawLines();
  }
  if(draggingCanvas){
    view.x = draggingCanvas.vx + (e.clientX-draggingCanvas.x);
    view.y = draggingCanvas.vy + (e.clientY-draggingCanvas.y);
    applyView();
  }
};
window.onpointerup = ()=>{
  if(draggingNode){ draggingNode=null; autosave(); }
  draggingCanvas=null; canvas.classList.remove("dragging");
};
canvas.onwheel = e=>{
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  zoom(e.deltaY < 0 ? 1.08 : 1/1.08, e.clientX - rect.left - rect.width/2, e.clientY - rect.top - 190);
};

window.onkeydown=e=>{
  if(document.activeElement === document.getElementById("topEditor")) return;
  if((e.key==="Enter" || e.key==="F2") && selectedNodeId){ e.preventDefault(); startTopEdit(); }
  if(e.key==="Delete" || e.key==="Backspace"){ if(selectedNodeId){ e.preventDefault(); deleteNode(); } }
};

restore();
selectedNodeId = rootNode(activeTree())?.id || null;
renderAll();
setTimeout(fit, 50);
</script>
</body>
</html>
